name: academic_elite
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in
# flutter build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter

  intl: any

  
  dotted_border: ^2.1.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  table_calendar: ^3.2.0
  animated_notch_bottom_bar: ^1.0.4
  syncfusion_flutter_charts: ^31.1.19
  url_launcher: ^6.3.2
  lottie: ^3.3.1
  flutter_screenutil: ^5.9.3
  introduction_screen: ^4.0.0
  bloc: ^9.1.0
  file_picker: ^10.3.7
  pin_code_fields: ^8.0.1
  google_generative_ai: ^0.4.7
  pinput: ^5.0.1
  animated_switch: ^0.0.3
  animated_toggle_switch: ^0.8.7
  internet_connection_checker_plus: ^2.9.1+2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  injectable: ^2.7.1+4
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated with the `analysis_options.yaml` file located at the root of your
  # package.
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

  injectable_generator: ^2.12.1
  build_runner: ^2.13.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/icon/icon.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo/logo.svg
  android: true
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#ffffff"
    image: assets/logo/logo.svg

# For information about the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Required for Flutter localization code generation.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons
  # in the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  assets:
    - assets/icons/
    - assets/images/
    - assets/logo/
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific variants.
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding custom fonts to your application, see:
  # https://docs.flutter.dev/ui/assets/assets-and-images#fonts

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai/Almarai-ExtraBold.ttf
          weight: 800